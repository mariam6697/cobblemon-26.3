name: Fabric baseline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fabric-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Fabric 1.21.1 / Java 21
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Fabric reference without a build cache
        env:
          # Each hosted job resolves dependencies from an empty, isolated directory.
          GRADLE_USER_HOME: ${{ runner.temp }}/cobblemon-gradle
        run: >-
          ./gradlew -Penabled_platforms=fabric
          -Pkotlin.compiler.execution.strategy=in-process
          -Dorg.gradle.jvmargs=-Xmx6G
          --no-build-cache --no-parallel --max-workers=2
          :fabric:assemble --console=plain

      - name: Verify the production JAR
        run: python3 .github/scripts/verify_baseline.py

      - name: Upload the verified reference artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fabric-baseline-1.21.1
          path: |
            build/libs/Cobblemon-fabric-*.jar
            build/reports/baseline-artifact.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
